# beautystart.ru — Production Nginx config
# www.beautystart.ru is the canonical domain (support recommendation)
# Nginx serves static files directly, no PM2 serve proxy
# HTTP/2, gzip, security headers, SPA fallback

# ─── HTTP → HTTPS (always to www) ───
server {
    listen 80;
    server_name beautystart.ru www.beautystart.ru 168.222.193.241;
    return 301 https://www.beautystart.ru$request_uri;
}

# ─── HTTPS without www → redirect to www ───
server {
    listen 443 ssl http2;
    server_name beautystart.ru;

    ssl_certificate     /etc/letsencrypt/live/beautystart.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beautystart.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.beautystart.ru$request_uri;
}

# ─── Main HTTPS server (www — canonical) ───
server {
    listen 443 ssl http2;
    server_name www.beautystart.ru;

    client_max_body_size 100M;

    # SSL certificates (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/beautystart.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beautystart.ru/privkey.pem;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL session cache (reduces TLS handshake overhead)
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2
        font/woff
        application/font-woff
        application/font-woff2;

    # Static files — nginx serves directly from dist/
    root /opt/myapp/dist;
    index index.html;

    # Static assets with long cache (Vite adds hash to filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Favicon, robots, etc.
    location ~* \.(ico|txt|webmanifest)$ {
        expires 7d;
        access_log off;
    }

    # SPA fallback — any route that isn't a file → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PocketBase Admin UI
    location /_ {
        proxy_pass http://localhost:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PocketBase API
    location /api {
        proxy_pass http://localhost:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

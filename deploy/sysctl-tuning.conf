# /etc/sysctl.d/99-beautystart.conf
# TCP/network tuning for 1GB RAM VPS

# Increase SYN backlog (was 128, too low)
net.ipv4.tcp_max_syn_backlog = 1024

# Enable SYN cookies (protect against SYN flood)
net.ipv4.tcp_syncookies = 1

# Reuse TIME_WAIT sockets faster
net.ipv4.tcp_tw_reuse = 1

# Reduce keepalive time (free connections sooner)
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5

# Increase connection tracking for small VPS
net.core.netdev_max_backlog = 2048
